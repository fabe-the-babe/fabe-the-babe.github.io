<!DOCTYPE html>
<html lang="fr"><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Meloire — Écouter</title>
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Special+Elite&family=Caveat:wght@400;700&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
:root {
  --ink:    #1a1410;
  --red:    #b01c22;
  --paper:  #e8dece;
  --paper2: #d9ccb8;
  --aged:   #8a7a68;
  --white:  #f4ede0;
  --line:   rgba(26,20,16,0.13);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}

body {
  font-family:'DM Mono',monospace;
  background:var(--paper);
  color:var(--ink);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:3rem 1.5rem;
  position:relative;
  overflow-x:hidden;
}

/* grain */
body::after {
  content:'';position:fixed;inset:0;pointer-events:none;z-index:999;
  opacity:.055;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:180px;
}

/* ruled lines */
body::before {
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:repeating-linear-gradient(
    to bottom,transparent 0px,transparent 31px,var(--line) 32px
  );
}

.card {
  position:relative;z-index:1;
  width:100%;max-width:480px;
  background:var(--white);
  border:1px solid var(--line);
  padding:3rem 2.8rem 2.8rem;
  background-image:repeating-linear-gradient(
    to bottom,transparent 0px,transparent 31px,var(--line) 32px
  );
}

/* stamp top */
.stamp {
  font-family:'Special Elite',cursive;
  font-size:.58rem;letter-spacing:.22em;text-transform:uppercase;
  color:var(--red);border:1.5px solid var(--red);
  display:inline-block;padding:.18rem .65rem;
  transform:rotate(-1.8deg);
  margin-bottom:2rem;
  opacity:.85;
}

/* cover */
.cover-wrap {
  width:100%;aspect-ratio:1;
  overflow:hidden;
  box-shadow:4px 6px 22px rgba(0,0,0,.18);
  margin-bottom:1.8rem;
  position:relative;
}
.cover-wrap img {
  width:100%;height:100%;
  object-fit:cover;
  filter:sepia(15%) contrast(1.04);
  display:block;
}

/* title block */
.artist-name {
  font-family:'IM Fell English',serif;
  font-size:2.6rem;line-height:.95;font-weight:400;
  letter-spacing:.01em;
  margin-bottom:.2rem;
}
.album-title {
  font-family:'Caveat',cursive;font-weight:700;
  font-size:1.2rem;color:var(--red);
  transform:rotate(-.6deg);display:inline-block;
  margin-bottom:1.6rem;
}

/* divider */
.divider {
  border:none;border-top:1px solid var(--line);
  margin:1.4rem 0;
}

/* platform links */
.platforms {
  display:flex;flex-direction:column;gap:0;
}
.platform-link {
  display:flex;align-items:center;gap:1rem;
  padding:.85rem 0;
  border-bottom:1px solid var(--line);
  text-decoration:none;
  color:var(--ink);
  transition:background .18s,padding-left .18s,color .18s;
  position:relative;
}
.platform-link:last-child{border-bottom:none}
.platform-link:hover{padding-left:.6rem;color:var(--red)}
.platform-link:hover .pl-arrow{opacity:1;transform:translateX(0)}

.pl-icon {
  width:36px;height:36px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:var(--paper2);
}
.pl-icon svg{width:18px;height:18px;fill:currentColor}

.pl-name {
  font-family:'Special Elite',cursive;
  font-size:.95rem;letter-spacing:.04em;
  flex:1;
}
.pl-sub {
  font-family:'DM Mono',monospace;
  font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--aged);margin-top:.1rem;
}
.pl-text{display:flex;flex-direction:column}

.pl-arrow {
  font-family:'DM Mono',monospace;font-size:.7rem;
  color:var(--red);opacity:0;
  transform:translateX(-6px);
  transition:opacity .18s,transform .18s;
}

/* footer note */
.card-footer {
  margin-top:2rem;
  font-family:'Caveat',cursive;
  font-size:.95rem;color:var(--aged);
  text-align:center;
  transform:rotate(-.3deg);
}
.card-footer a{color:var(--red);text-decoration:none}
.card-footer a:hover{text-decoration:underline}

/* dossier number top-right */
.dossier-no {
  position:absolute;top:1rem;right:1.2rem;
  font-family:'DM Mono',monospace;font-size:.55rem;
  letter-spacing:.1em;color:var(--aged);opacity:.6;
}

.video-container {
  width: 100%;             /* Fills mobile screens completely */
  max-width: 800px;        /* Limits desktop size (adjust as needed) */
  margin: 0 auto;          /* Centers the container horizontally */
}

.video-container iframe {
  width: 100%;             /* Scales to match the parent's width */
  height: auto;            /* Lets the height be calculated by aspect-ratio */
  aspect-ratio: 16 / 9;    /* Maintains standard widescreen dimensions */
  display: block;          /* Prevents unwanted inline white space */
}

/* fade in */
.card{animation:fadeUp .7s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<div style="max-width:90%;" class="card">
  <div class="dossier-no">MTL-2026-001</div>


  <div class="artist-name">Meloire</div>
  <br> <!-- Saut de ligne -->
  <br>
  <!-- PREMIER PROJET-->
  <div class="album-title">Titre projet 1</div>
  <br>
  <div class="video-container">

      src="https://youtu.be/sCXqGBrbiTM"

      allowfullscreen>
    </iframe>
  </div>
  <br>
  <p>Petite description pas mal du tout stv</p>
  <hr class="divider"> <!-- Saut de ligne plus prononcée -->
  <!-- FIN PREMIER PROJET-->

  </nav>

  <p class="card-footer">
    pop alt. · rock · folk · Montréal, QC<br>

    &nbsp;·&nbsp;

  </p>
</div>



</body></html>
